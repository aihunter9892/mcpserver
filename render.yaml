# Render deploy WITHOUT Docker - native Python runtime.
# Render installs requirements.txt itself and runs the start command.
# No Dockerfile involved. This is the simplest cloud path.
#
# healthCheckPath points at /health, a plain JSON endpoint.
# Never point it at /mcp: that is a Server-Sent Events stream that stays open
# by design, so the probe hangs and Render restart-loops the service.
services:
  - type: web
    name: llm-toolkit-mcp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py --http
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false          # set this in the Render dashboard, never in git
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Uncomment to require a bearer token on every request.
      # - key: MCP_AUTH_TOKEN
      #   sync: false
      - key: RATE_LIMIT_PER_MIN
        value: "30"
